name: Deploy TaskManagerPlusWeb

on:
  push:
    branches:
      - main
    paths:
      - 'TaskManagerPlus/TaskManagerPlusWeb/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: TaskManagerPlus/TaskManagerPlusWeb/package-lock.json

      - name: Install Dependencies
        run: npm install
        working-directory: TaskManagerPlus/TaskManagerPlusWeb

      - name: Build Project
        run: npm run build
        working-directory: TaskManagerPlus/TaskManagerPlusWeb

      - name: Deploy to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "TaskManagerPlus/TaskManagerPlusWeb/dist/*"
          target: "/home/ubuntu/taskmanagerweb"
          strip_components: 3 # Remove TaskManagerPlus/TaskManagerPlusWeb/dist prefix

      - name: Verify Deployment (Optional)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo docker restart taskmanagerweb
